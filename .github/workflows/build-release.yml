name: Build and Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Twilight
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew clean :twilight:build --no-daemon

      - name: Create checksum
        working-directory: twilight/build/libs
        run: sha256sum Twilight.jar > Twilight.jar.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Twilight-${{ github.sha }}
          path: |
            twilight/build/libs/Twilight.jar
            twilight/build/libs/Twilight.jar.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub pre-release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download verified build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Twilight-${{ github.sha }}
          path: release-artifacts

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-artifacts/Twilight.jar
          release-artifacts/Twilight.jar.sha256
          --verify-tag
          --title "Twilight ${GITHUB_REF_NAME#v}"
          --notes-file RELEASE_NOTES.md
          --prerelease
          --latest=false
