image: eclipse-temurin:25-jdk

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

stages:
  - build
  - release

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

cache:
  key: gradle-wrapper
  paths:
    - .gradle/caches
    - .gradle/wrapper

build:
  stage: build
  script:
    - chmod +x gradlew
    - ./gradlew clean :twilight:build --no-daemon
    - cd twilight/build/libs
    - sha256sum Twilight.jar > Twilight.jar.sha256
  artifacts:
    name: "Twilight-$CI_COMMIT_SHA"
    paths:
      - twilight/build/libs/Twilight.jar
      - twilight/build/libs/Twilight.jar.sha256
      - twilight/build/reports/tests/test/
    expire_in: 14 days
    when: always
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: build
      artifacts: true
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  script:
    - >-
      glab release create "$CI_COMMIT_TAG"
      'twilight/build/libs/Twilight.jar#Twilight.jar#package'
      'twilight/build/libs/Twilight.jar.sha256#Twilight.jar.sha256#other'
      --repo "$CI_PROJECT_PATH"
      --ref "$CI_COMMIT_SHA"
      --name "Twilight ${CI_COMMIT_TAG#v}"
      --notes-file RELEASE_NOTES.md
      --use-package-registry
      --no-update
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-pre\.\d+$/'
